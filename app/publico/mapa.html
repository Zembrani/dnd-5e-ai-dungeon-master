<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa — combate</title>
<style>
:root {
  --tinta: #16110d; --couro: #211a14; --couro-claro: #2b221a; --borda: #3d3226;
  --pergaminho: #e9dcc3; --pergaminho-suave: #a99878; --brasa: #d9a441;
  --brasa-escura: #8a6420; --sangue: #a83a3a; --arcano: #4e9c86;
  --serifa: "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--tinta); color: var(--pergaminho); font-family: var(--sans);
  font-size: 15px; display: flex; flex-direction: column; overflow: hidden;
}
#topo {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: 1px solid var(--borda); background: var(--couro);
}
#topo .rodada { font-family: var(--serifa); font-size: 20px; color: var(--brasa); }
#topo .cenario { font-size: 13px; color: var(--pergaminho-suave); }
#corpo { flex: 1; display: flex; min-height: 0; }
#area-mapa {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
  padding: 16px; overflow: hidden; background:
    radial-gradient(circle at 50% 40%, #1c1610, var(--tinta));
}
#mapa-caixa {
  position: relative; border: 1px solid var(--borda); border-radius: 8px;
  overflow: hidden; background: var(--tinta); user-select: none;
  box-shadow: 0 6px 30px rgba(0,0,0,.5);
}
#mapa-caixa img.fundo { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#grade { position: absolute; inset: 0; }
.token {
  position: absolute; border-radius: 50%; border: 2px solid var(--pergaminho-suave);
  background-size: cover; background-position: center top; background-color: var(--couro-claro);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; color: var(--pergaminho); box-shadow: 0 1px 4px rgba(0,0,0,.6);
  cursor: default; transition: left .25s, top .25s;
}
.token.jogador { border-color: var(--arcano); cursor: grab; }
.token.jogador.arrastando { cursor: grabbing; transition: none; z-index: 5; }
.token.inimigo { border-color: var(--sangue); }
.token.aliado { border-color: var(--brasa); }
.token.ativo-turno { box-shadow: 0 0 0 3px var(--brasa); }
.token.caido { filter: grayscale(1) brightness(.5); }
#lado {
  width: 320px; flex-shrink: 0; border-left: 1px solid var(--borda);
  background: var(--couro); padding: 16px; overflow-y: auto;
}
.titulo {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brasa);
  border-bottom: 1px solid var(--borda); padding-bottom: 4px; margin: 0 0 10px;
}
#iniciativa { list-style: none; margin: 0; padding: 0; }
#iniciativa li {
  display: grid; grid-template-columns: 34px 1fr 64px; gap: 8px; align-items: center;
  padding: 9px 10px; border-radius: 8px; margin-bottom: 6px;
  background: var(--couro-claro); border: 1px solid var(--borda); font-size: 14.5px;
}
#iniciativa li.ativo-turno { border-color: var(--brasa); box-shadow: 0 0 0 1px var(--brasa-escura); }
#iniciativa li.caido { opacity: .45; }
#iniciativa .ini { font-family: var(--serifa); font-size: 18px; color: var(--brasa); text-align: center; }
#iniciativa .quem .nome { display: block; }
#iniciativa .quem .extras { font-size: 11px; color: var(--pergaminho-suave); }
#iniciativa .hp { font-size: 12px; text-align: right; }
.barra { background: var(--tinta); border: 1px solid var(--borda); border-radius: 6px;
  height: 8px; overflow: hidden; margin-top: 4px; }
.barra > i { display: block; height: 100%; background: var(--sangue); transition: width .4s; }
.condicao { display: inline-block; background: #3a2020; color: #e0a0a0;
  border: 1px solid var(--sangue); border-radius: 20px; padding: 1px 8px;
  font-size: 11px; margin: 1px; }
#vazio { margin: auto; text-align: center; color: var(--pergaminho-suave); padding: 40px; }
#dica-mover { font-size: 11px; color: var(--pergaminho-suave); margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<header id="topo">
  <div class="rodada" id="rodada">Combate</div>
  <div class="cenario" id="cenario"></div>
</header>
<div id="corpo">
  <div id="area-mapa"><div id="mapa-caixa"></div><div id="vazio" class="oculto"></div></div>
  <aside id="lado">
    <p class="titulo">Iniciativa</p>
    <ol id="iniciativa"></ol>
    <p id="dica-mover">Arraste o seu token (borda verde) para se mover. O mestre valida no próximo turno.</p>
  </aside>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto != null) e.textContent = texto;
  return e;
}
let COMBATE = null;

function vidaAproximada(hp) {
  const r = hp.atual / hp.max;
  if (hp.atual <= 0) return "caído";
  if (r > 0.75) return "ileso";
  if (r > 0.4) return "ferido";
  return "grave";
}

function render() {
  const c = COMBATE;
  const ativo = c && c.ativo;
  const vazio = $("#vazio"), caixa = $("#mapa-caixa");
  if (!ativo) {
    $("#rodada").textContent = "Sem combate ativo";
    $("#cenario").textContent = "";
    caixa.classList.add("oculto");
    vazio.classList.remove("oculto");
    vazio.textContent = "⚔️ Nenhum combate ativo no momento. Esta aba atualiza sozinha quando a iniciativa rolar.";
    $("#iniciativa").innerHTML = "";
    return;
  }
  caixa.classList.remove("oculto");
  vazio.classList.add("oculto");
  $("#rodada").textContent = `Rodada ${c.rodada || 1}${c.turno ? ` — turno de ${c.turno}` : ""}`;
  $("#cenario").textContent = c.cenario || "";
  desenharMapa(c);
  desenharIniciativa(c);
}

function desenharMapa(c) {
  const caixa = $("#mapa-caixa");
  caixa.innerHTML = "";
  const grid = (c.mapa && c.mapa.grid) || { cols: 12, rows: 9 };
  const area = $("#area-mapa");
  const dispW = area.clientWidth - 32;
  const dispH = area.clientHeight - 32;
  // maior célula que faz o mapa inteiro caber na área (largura e altura)
  const cel = Math.max(8, Math.floor(Math.min(dispW / grid.cols, dispH / grid.rows)));
  const largura = cel * grid.cols, altura = cel * grid.rows;
  caixa.style.width = largura + "px";
  caixa.style.height = altura + "px";

  const montarGrade = () => {
    const g = el("div"); g.id = "grade";
    g.style.backgroundImage =
      "linear-gradient(rgba(233,220,195,.14) 1px, transparent 1px)," +
      "linear-gradient(90deg, rgba(233,220,195,.14) 1px, transparent 1px)";
    g.style.backgroundSize = `${cel}px ${cel}px`;
    caixa.appendChild(g);
    desenharTokens(c, caixa, cel);
  };
  if (c.mapa && c.mapa.imagem) {
    const img = new Image();
    img.className = "fundo";
    img.src = "/" + c.mapa.imagem.replace(/^\//, "");
    img.onload = montarGrade;
    img.onerror = montarGrade;
    caixa.appendChild(img);
  } else {
    montarGrade();
  }
}

function desenharTokens(c, caixa, cel) {
  for (const k of c.combatentes || []) {
    if (!k.pos || (k.hp && k.hp.atual <= 0 && k.tipo !== "jogador")) continue;
    const cls = k.tipo === "jogador" ? "jogador" : (k.tipo === "aliado" ? "aliado" : "inimigo");
    const t = el("div", "token " + cls);
    if (k.hp && k.hp.atual <= 0) t.classList.add("caido");
    if (c.turno && k.nome === c.turno) t.classList.add("ativo-turno");
    const tam = Math.max(20, cel * (k.tamanho || 1) - 6);
    t.style.width = t.style.height = tam + "px";
    t.style.fontSize = Math.max(10, tam * 0.32) + "px";
    t.style.left = k.pos.x * cel + (cel - tam) / 2 + "px";
    t.style.top = k.pos.y * cel + (cel - tam) / 2 + "px";
    if (k.token) t.style.backgroundImage = `url(/${k.token.replace(/^\//, "")})`;
    else t.textContent = (k.nome || "?").slice(0, 2).toUpperCase();
    t.title = `${k.nome} (${String.fromCharCode(65 + k.pos.x)}${k.pos.y + 1})`;
    if (k.tipo === "jogador") arrastavel(t, k, caixa, cel, c);
    caixa.appendChild(t);
  }
}

function arrastavel(t, k, caixa, cel, c) {
  t.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    t.setPointerCapture(e.pointerId);
    t.classList.add("arrastando");
    const caixaRect = caixa.getBoundingClientRect();
    const mover = (ev) => {
      t.style.left = ev.clientX - caixaRect.left - t.offsetWidth / 2 + "px";
      t.style.top = ev.clientY - caixaRect.top - t.offsetHeight / 2 + "px";
    };
    const soltar = async (ev) => {
      t.removeEventListener("pointermove", mover);
      t.removeEventListener("pointerup", soltar);
      t.classList.remove("arrastando");
      const grid = (c.mapa && c.mapa.grid) || { cols: 12, rows: 9 };
      const x = Math.min(grid.cols - 1, Math.max(0, Math.floor((ev.clientX - caixaRect.left) / cel)));
      const y = Math.min(grid.rows - 1, Math.max(0, Math.floor((ev.clientY - caixaRect.top) / cel)));
      const tam = t.offsetWidth;
      t.style.left = x * cel + (cel - tam) / 2 + "px";
      t.style.top = y * cel + (cel - tam) / 2 + "px";
      try {
        await fetch("/api/mover", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: k.id, x, y }),
        });
      } catch {}
    };
    t.addEventListener("pointermove", mover);
    t.addEventListener("pointerup", soltar);
  });
}

function desenharIniciativa(c) {
  const ol = $("#iniciativa");
  ol.innerHTML = "";
  const ordem = [...(c.combatentes || [])].sort((a, b) => (b.iniciativa || 0) - (a.iniciativa || 0));
  for (const k of ordem) {
    const li = el("li");
    if (c.turno && k.nome === c.turno) li.classList.add("ativo-turno");
    if (k.hp && k.hp.atual <= 0) li.classList.add("caido");
    li.appendChild(el("div", "ini", String(k.iniciativa ?? "—")));
    const quem = el("div", "quem");
    quem.appendChild(el("span", "nome", k.nome));
    const extras = [k.ca != null ? `CA ${k.ca}` : null, k.zona, ...(k.condicoes || [])]
      .filter(Boolean).join(" · ");
    if (extras) quem.appendChild(el("span", "extras", extras));
    li.appendChild(quem);
    const hp = el("div", "hp");
    if (k.hp) {
      hp.appendChild(document.createTextNode(
        k.tipo === "jogador" ? `${k.hp.atual}/${k.hp.max}` : vidaAproximada(k.hp)));
      const b = el("div", "barra"); const i = el("i");
      i.style.width = Math.max(0, 100 * k.hp.atual / k.hp.max) + "%";
      b.appendChild(i); hp.appendChild(b);
    }
    li.appendChild(hp);
    ol.appendChild(li);
  }
}

async function carregar() {
  try {
    const est = await fetch("/api/estado").then((r) => r.json());
    document.title = `Mapa — ${est.campanha}`;
    COMBATE = est.combate;
    render();
  } catch { /* servidor caiu */ }
}
new EventSource("/api/eventos").addEventListener("message", (e) => {
  try { if (JSON.parse(e.data).tipo === "estado") carregar(); } catch {}
});
let redim;
window.addEventListener("resize", () => { clearTimeout(redim); redim = setTimeout(render, 150); });
carregar();
</script>
</body>
</html>
